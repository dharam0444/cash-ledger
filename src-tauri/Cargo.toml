[package]
name = "offline-cash-ledger"
version = "0.1.0"
description = "Offline cash deposit and withdrawal ledger desktop application"
authors = ["Cash Ledger"]
edition = "2021"

[lib]
name = "offline_cash_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
hex = "0.4"
hmac = "0.12"
rand_core = { version = "0.6", features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "1"
